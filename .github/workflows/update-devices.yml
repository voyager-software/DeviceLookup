name: Update devices

# Checks the newest Xcode on GitHub's runners, betas and release candidates included, for device
# identifiers missing from devices.json, and Apple's "Identify your Mac model" pages for Macs that
# macs.json doesn't have. Opens a pull request with what it finds. The report in the pull request
# lists what still needs filling in by hand: chips, diagonals, cellular and watch case sizes.
# GitHub holds CI on a pull request opened by github-actions[bot] until a maintainer approves it on the
# pull request page.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-devices

jobs:
  update:
    runs-on: xcode-27
    env:
      BRANCH: update-devices
      DEVICES_JSON: Sources/DeviceLookup/Resources/devices.json
      MACS_JSON: Sources/DeviceLookup/Resources/macs.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          echo "XCODE=$xcode" >> "$GITHUB_ENV"
          echo "Using $xcode"

      # Build on an open pull request rather than replace it, so values filled in there are kept.
      # The script never overwrites a value that's already in devices.json.
      - name: Check out the open pull request
        run: |
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            git checkout "$BRANCH"
            echo "PR_OPEN=1" >> "$GITHUB_ENV"
          fi

      - name: Update devices.json
        run: |
          python3 Scripts/update-devices.py --write --xcode "$XCODE" | tee "$RUNNER_TEMP/devices.txt"

      # A page Apple redesigned makes the script stop without writing. The devices still get their
      # pull request, and the last step fails the run so the change is noticed.
      - name: Update macs.json
        run: |
          set -o pipefail
          if ! python3 Scripts/update-macs.py --write | tee "$RUNNER_TEMP/macs.txt"; then
            echo "MACS_FAILED=1" >> "$GITHUB_ENV"
          fi

      - name: Open or update the pull request
        run: |
          git diff --quiet -- "$DEVICES_JSON" || devices_changed=1
          git diff --quiet -- "$MACS_JSON" || macs_changed=1
          if [ -z "${devices_changed:-}${macs_changed:-}" ]; then
            echo "Nothing new in $(basename "$XCODE" .app) or on Apple's Mac pages."
            exit 0
          fi

          subjects=()
          {
            if [ -n "${devices_changed:-}" ]; then
              added=$(grep -c '^NEW ' "$RUNNER_TEMP/devices.txt" || true)
              [ "$added" = 1 ] && devices=device || devices=devices
              subjects+=("$added $devices from $(basename "$XCODE" .app)")
              echo "Xcode lists device identifiers that devices.json doesn't have. This adds them with their names and SoC codes."
              echo
              echo "Before merging, fill in what the report lists under TO FILL, and append the case size to new watch names. The tests fail until every device has a chip and a diagonal."
              echo
              echo '```'
              cat "$RUNNER_TEMP/devices.txt"
              echo '```'
              echo
            fi
            if [ -n "${macs_changed:-}" ]; then
              subjects+=("Macs from Apple's pages")
              echo "Apple's Mac pages differ from macs.json. NEW lines are added or renamed Macs; MISSING lines are what they replace."
              echo
              echo '```'
              cat "$RUNNER_TEMP/macs.txt"
              echo '```'
            fi
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          message="Update $(IFS=,; echo "${subjects[*]}" | sed 's/,/ and /')"
          git commit -am "$message"

          if [ -n "${PR_OPEN:-}" ]; then
            git push origin "$BRANCH"
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            # Any branch left from an earlier, closed pull request is replaced.
            git push --force origin "$BRANCH"
            gh pr create --head "$BRANCH" --title "Update device data" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Fail if Apple's Mac pages couldn't be read
        if: env.MACS_FAILED == '1'
        run: |
          echo "::error::update-macs.py found fewer Macs than macs.json has, so an Apple page may have changed format. See the Update macs.json step."
          exit 1
